server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets or fallback to index.html for SPA hash routing
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Ensure dbt metadata JSON files are not cached by browsers
    location ~* \.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }
}